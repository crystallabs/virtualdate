name: virtualdate
version: 1.4.0

authors:
  - Davor Ocelic <docelic@crystallabs.io>

# `bench/scheduler.cr` uses `Time.instant`, which replaced the now-deprecated
# `Time.monotonic` in Crystal 1.19.0.
crystal: ">= 1.19.0"

license: AGPL-3.0

# Ameba declares build targets but no `executables`, so installing it does not
# by itself put a runnable binary in ./bin. Declaring it as a target here is the
# flow Ameba's own README documents: `shards build ameba` compiles ./bin/ameba.
targets:
  ameba:
    main: lib/ameba/bin/ameba.cr

dependencies:
  virtualtime:
    github: crystallabs/virtualtime
    # The scheduler relies on VirtualTime#to_time and Search fixes from 1.5.0
    version: ~> 1.5

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    branch: master
